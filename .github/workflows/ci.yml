name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.4"
          otp-version: "27.3"
      - name: Install deps
        run: mix deps.get
      - name: Compile
        run: mix compile --warnings-as-errors
      - name: Test
        run: mix test
      - name: Build docs
        run: MIX_ENV=docs mix docs
