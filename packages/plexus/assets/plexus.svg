<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">Plexus logo</title>
  <desc id="desc">Hexagonal logo with a semantic network motif for Plexus.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081225"/>
      <stop offset="55%" stop-color="#102b4c"/>
      <stop offset="100%" stop-color="#1e4a6e"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8dfcff" stop-opacity="1"/>
      <stop offset="50%" stop-color="#63b9ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#355ef0" stop-opacity="0.75"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ef7ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#2f7cff" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0  0 0.85 0 0 0.15  0 0 1 0 0.35  0 0 0 1 0" result="color"/>
      <feMerge>
        <feMergeNode in="color"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hex-clip">
      <path d="M100 8 L174 50 L174 150 L100 192 L26 150 L26 50 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hex-clip)">
    <path d="M100 8 L174 50 L174 150 L100 192 L26 150 L26 50 Z" fill="url(#bg)"/>
    <g opacity="0.3">
      <path d="M24 72 C70 48, 132 50, 176 74" fill="none" stroke="#8dfcff" stroke-width="1.5"/>
      <path d="M20 118 C68 96, 130 100, 180 122" fill="none" stroke="#6aa9ff" stroke-width="1.2"/>
      <path d="M58 18 L142 182" fill="none" stroke="#5fe8ff" stroke-width="1"/>
      <path d="M142 18 L58 182" fill="none" stroke="#4575ff" stroke-width="1"/>
    </g>

    <g filter="url(#glow)">
      <circle cx="100" cy="100" r="24" fill="url(#core)" opacity="0.9"/>
      <circle cx="100" cy="100" r="8" fill="#ffffff" opacity="0.95"/>

      <g fill="none" stroke="url(#stroke)" stroke-linecap="round" stroke-width="4">
        <path d="M100 100 L62 58"/>
        <path d="M100 100 L138 58"/>
        <path d="M100 100 L54 104"/>
        <path d="M100 100 L146 104"/>
        <path d="M100 100 L72 144"/>
        <path d="M100 100 L128 144"/>
      </g>

      <g fill="#d8fdff" stroke="#7ef7ff" stroke-width="1.5">
        <circle cx="62" cy="58" r="9"/>
        <circle cx="138" cy="58" r="9"/>
        <circle cx="54" cy="104" r="8"/>
        <circle cx="146" cy="104" r="8"/>
        <circle cx="72" cy="144" r="9"/>
        <circle cx="128" cy="144" r="9"/>
      </g>

      <g fill="none" stroke="#a6f8ff" stroke-width="2" stroke-dasharray="2 4" opacity="0.8">
        <path d="M62 58 C82 46, 118 46, 138 58"/>
        <path d="M54 104 C70 130, 108 144, 128 144"/>
        <path d="M146 104 C132 130, 94 144, 72 144"/>
      </g>
    </g>
  </g>

  <path d="M100 8 L174 50 L174 150 L100 192 L26 150 L26 50 Z" fill="none" stroke="#9cf8ff" stroke-opacity="0.9" stroke-width="3"/>
  <path d="M100 18 L165 55 L165 145 L100 182 L35 145 L35 55 Z" fill="none" stroke="#2a4f88" stroke-opacity="0.85" stroke-width="1.4"/>
</svg>
